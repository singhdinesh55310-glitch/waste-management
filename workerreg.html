<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{scroll-behavior: auto;}
        *{ margin: 0;
            padding:0;
            box-sizing: border-box;
            
             }
            body{
                margin:0;
                min-height: 100vh;
                overflow-x: hidden;
                font-family:"Segoue" Arial, sans-serif;
                background-color: linear-gradient(135deg,#dbeafe,#e0f2fe);
                background: 
                radial-gradient(circle at 10% 20%,rgba(37,99,235,0.18),transparent 30%),radial-gradient(circle at 90% 80%,rgba(59,130,246,0.15),transparent 30%),
                linear-gradient(135deg,#eef4ff,#f8fbff);
              display: flex;
                justify-content: center;
                align-items:center;
                color:#1e293b;
            
            
                
                
                background:
url("clean_city_background.jpg");
                
background-size:cover;
background-position:center;
background-repeat:no-repeat;
                            
               
                            }
            .login-container{
                background:rgba(255,255,255,0.0001);
                backdrop-filter:blur(0.0001px);
                -webkit-backdrop-filter:blur(10px);
                border:1px  solid rgba(255,255,255,0.35);
                border-radius:20px;
                box-shadow:0 8px 32px rgba(0,0,0,0.2);
                padding:35px;
                
                max-width: 520px;
                padding:40px;
            }
            .login-container h1{
                text-align:center;
                font-size:32px;
                font-weight: 700;
                color:white;
                padding:22px 30px;
                margin-bottom:30px;
                border-radius: 18px;
                background: linear-gradient(135deg,#2563eb,#1d4ed8);
                box-shadow: 0 15px 35px rgba(37,99,235,0.25);

            }

            form{
                width:450px;
                padding:35px 40px;
                background: white;
                border-radius:20px;
                box-shadow:0 15px 40px;
            }
            h1{
                text-align: center;
                background:linear-gradient(135deg,#2dda3e,#70c784);
                color:white;
                padding:20px;
                margin:0 0 25px 0;
                border-radius:12px;
                font-size:30px; }
                h2{
text-align :center;
color:#1e3a8a;
          margin-bottom:25px; }
          
label{
    display:block;
    margin-bottom:7px;
    color:#374151;
    font-weight:bold;}
    input,
    textarea{
        width:100%;
        padding:13px;
        margin-bottom:18px;

    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    outline:none;
    background:#f9fafb;
transition:0.3s;
}

input:focus,
textarea:focus{
border-color:#2563eb;
background:white;
box-shadow: 0 0 0 4px rgba(37,99,235,0.15);}
.login-container{
    width:100%;
}
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(145deg,#49df4b,#13b216);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:all 0.25sease;
    box-shadow: 0 10px 20px rgba(37,99,235,0.25);

}label{
    display:flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    color:#374151;
    font-weight: bold;
}



label svg{
    color:#2563eb;
}
button::before{
    content: "\2192 ";
    margin-right:10px;
    font-size:22px;
    transition:transform 0.3s ease;
}
button:hover::before{
    transform:translateX(4px);
}
button:hover{
    box-shadow: 0 8px 20px rgba(37,99,235,0.3);
}

@media(max-width:600px){
    .login-container{
        padding: 20px;
    }
    form{
        width:90%;
        padding:25px;
    }.login-container h1{font-size: 24px;
    padding:18px; input,button{
        width:100%;
        box-sizing: border-box;
    }}
}
    </style>
</head>
<body><div class="card">
   <h1 style="text-align: center; background-color: rgb(19, 19, 96);">WORKER  REG. PORTAL</h1> 
   <br><br>
   <h2> PLEASE UPLOAD YOUR DETAILS</h2>

   
   <form class="login-container">
    <label for="username">NAME :</label>
    <input type="text" id="username" name="username" placeholder="ENTER FULL NAME">
    <label for="email">EMAIL:</label>
    <input type="email" name="email" id="email" placeholder="singhdinesh@gmail.com"
    <label for="phone">📞Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="+91 7505467209"><br><br>
    
    <label for="password"><svg width="16" height="16" viewBox=0 0 24 24
        fill="none" stroke="currentColor"
        stroke-width="2">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Password:</label>
    <input type="password" id="password" name="password" placeholder="Create  your password"><br><br>
<label for="confirmpassword"><svg width="16" height="16" viewBox=0 0 24 24
        fill="none" stroke="currentColor"
        stroke-width="2">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Confirm Password :</label>
    <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirm your password"><br><br>
    
  <div > <button type="submit" >REGISTER </button> <br><br>
    
   </form>
</body>
</html>
